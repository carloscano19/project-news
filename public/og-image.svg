<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .brand-serif { font-family: 'Fraunces', Georgia, serif; }
      .brand-sans { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
    <radialGradient id="glow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF4D2E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0F1115" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F5F3EE" />
    </linearGradient>
  </defs>

  <!-- Fondo #0F1115 -->
  <rect width="1200" height="630" fill="#0F1115" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Marco de cuadrícula sutil de fondo (representando el ruido filtrado) -->
  <g stroke="#1F242C" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="530" x2="1200" y2="530" />
  </g>

  <!-- Top Bar: Logo + Señal Badge -->
  <g transform="translate(120, 80)">
    <circle cx="8" cy="8" r="7" fill="#FF4D2E" />
    <text x="26" y="14" fill="#F5F3EE" font-size="20" font-weight="600" class="brand-sans" letter-spacing="-0.5">Project News</text>
    <text x="165" y="14" fill="#7C8591" font-size="18" class="brand-sans">/</text>
    <text x="182" y="14" fill="#7C8591" font-size="16" class="brand-sans">Señal entre ruido</text>

    <!-- Badge Edición Semanal -->
    <rect x="740" y="-8" width="220" height="34" rx="17" fill="#181C22" stroke="#242A34" stroke-width="1" />
    <circle cx="758" cy="9" r="4" fill="#2ECC71" />
    <text x="772" y="14" fill="#F5F3EE" font-size="13" font-weight="600" class="brand-sans">EDICIÓN SEMANAL</text>
  </g>

  <!-- Tarjeta Central Hero: Representando la señal en papel hueso #F5F3EE -->
  <g transform="translate(120, 150)">
    <!-- Sombra de tarjeta -->
    <rect x="0" y="0" width="960" height="340" rx="24" fill="#000000" opacity="0.4" />
    <rect x="0" y="0" width="960" height="336" rx="24" fill="url(#cardGrad)" stroke="#E6E2D8" stroke-width="1" />
    
    <!-- Acento superior de categoría Naranja Señal -->
    <path d="M 0 24 Q 0 0 24 0 L 936 0 Q 960 0 960 24 L 960 6 L 0 6 Z" fill="#FF4D2E" />

    <!-- Meta en tarjeta -->
    <g transform="translate(48, 48)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="rgba(255, 77, 46, 0.12)" />
      <text x="12" y="18" fill="#D93A1E" font-size="12" font-weight="700" class="brand-sans">IA SEARCH &amp; GEO</text>

      <rect x="730" y="-2" width="134" height="30" rx="15" fill="#121417" />
      <circle cx="748" cy="13" r="3.5" fill="#FF4D2E" />
      <text x="760" y="18" fill="#FFFFFF" font-size="13" font-weight="700" class="brand-sans">9.5 SEÑAL</text>

      <!-- Titular Principal en Fraunces Serif -->
      <text x="0" y="85" fill="#121417" font-size="38" font-weight="400" class="brand-serif" letter-spacing="-0.8">
        Lo que importa esta semana en
      </text>
      <text x="0" y="132" fill="#121417" font-size="38" font-weight="400" class="brand-serif" letter-spacing="-0.8">
        SEO, GEO e IA Search
      </text>

      <!-- Subtítulo / Resumen -->
      <text x="0" y="180" fill="#555E68" font-size="17" class="brand-sans" font-weight="400">
        Curación semanal de alta señal con filtro estricto de relevancia (≥ 8.0).
      </text>
      <text x="0" y="206" fill="#555E68" font-size="17" class="brand-sans" font-weight="400">
        Descartamos el ruido diario para extraer solo el impacto práctico directo.
      </text>

      <!-- Footer tarjeta -->
      <line x1="0" y1="235" x2="864" y2="235" stroke="#DFD9CD" stroke-width="1" />
      <text x="0" y="260" fill="#7C8591" font-size="13" class="brand-sans">Google · OpenAI · Search Engine Land · Search Engine Journal · Ahrefs</text>
      <text x="760" y="260" fill="#FF4D2E" font-size="13" font-weight="600" class="brand-sans">project-news ↗</text>
    </g>
  </g>

  <!-- Bottom Bar: URL y tagline -->
  <g transform="translate(120, 565)">
    <text x="0" y="0" fill="#7C8591" font-size="14" class="brand-sans">project-news-lac.vercel.app</text>
    <text x="960" y="0" text-anchor="end" fill="#7C8591" font-size="14" class="brand-sans">Semana a semana · Sin ruido</text>
  </g>
</svg>
